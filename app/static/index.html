<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roughcut — cut board</title>
<link rel="stylesheet" href="/timeline/timeline.css">
<link rel="stylesheet" href="/fx.css">
<style>
  :root {
    --bg: #101013; --panel: #17171c; --card: #1e1e25; --card-hi: #26262f;
    --line: #2e2e38; --text: #e8e8ee; --dim: #9a9aa8; --accent: #6ea8fe;
    --good: #64d08a; --warn: #e0b050; --bad: #e06a6a;
    --hd: 64px;                 /* the header's height, kept current by /dock.js */
    --dock-w: 380px;            /* the dock's width — dragged on its left edge, remembered */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 20; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 7px 16px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  header > button { padding: 5px 11px; }
  #undo, #redo { min-width: 34px; }
  #saveState[data-state="saved"] { display: none; }
  #saveState[data-state="failed"] { color: var(--bad); }
  #makeFilm .dot { color: var(--accent); margin-left: 6px; }
  .grow { flex: 1; }
  button {
    background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 11px; font: inherit; cursor: pointer;
  }
  button:hover { background: var(--card-hi); }
  /* No blue button of its own (INTAKE M16, one blue per screen): the one blue element is
     Next's `is-next`, put on by /flow.js. */
  button.ghost { border-color: transparent; color: var(--dim); }
  button:disabled { opacity: .45; cursor: default; }

  main { display: grid; grid-template-columns: minmax(0,1fr) var(--dock-w); gap: 16px;
         padding: 16px; align-items: start; }
  @media (max-width: 1100px) { main { grid-template-columns: minmax(0,1fr); } }

  /* The shot strip (INTAKE M16 I16.4): one panel under the timeline for the selected
     shot — or, with nothing selected, the film — sized so the header, the picture, the
     timeline and the strip fit 900 px without the page scrolling. */
  #inspector { margin-bottom: 10px; }
  #inspector .shot {
    display: grid; grid-template-columns: 150px minmax(0,1fr); gap: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px;
  }
  #inspector .none, #inspector .multi {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 12px; color: var(--dim);
  }
  #inspector .multi .count, #inspector .none .totals { color: var(--text);
                                                       font-variant-numeric: tabular-nums; }
  #inspector .none select { padding: 3px 6px; font-size: 12px; }
  #inspector .none .fstrength { display: inline-flex; }
  #inspector .none [hidden] { display: none; }
  #inspector .none .fstrength button { border-radius: 0; margin-left: -1px; }
  #inspector .none .fstrength button:first-child { border-radius: 7px 0 0 7px; }
  #inspector .none .fstrength button:last-child { border-radius: 0 7px 7px 0; }
  #inspector button { padding: 3px 9px; font-size: 12px; }
  #inspector button.on { border-color: var(--accent); color: var(--text); }
  #inspector .fwarn { color: var(--warn); }
  /* The picture is a still, not a stream: sixteen live proxies on one board took every
     connection Chrome had and the monitor played sound over black. */
  #inspector .poster { width: 100%; border-radius: 6px; background: #000; display: block;
                       aspect-ratio: 16/9; object-fit: cover; cursor: pointer;
                       -webkit-user-select: none; user-select: none; }
  .srow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .srow.top > .dv-res { order: 9; flex-basis: 100%; }
  .sname { font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 4px; }
  .lookhost:empty { display: none; }
  .why { color: var(--dim); margin: 4px 0 2px; min-height: 1.3em; }
  .why[contenteditable]:focus { outline: 1px solid var(--accent); border-radius: 4px;
                                color: var(--text); }
  .why[contenteditable]:empty::before { content: "why this shot — click to write";
                                        opacity: .5; }
  .said { color: var(--dim); font-style: italic; white-space: nowrap; overflow: hidden;
          text-overflow: ellipsis; margin-bottom: 4px; }
  .warns { display: flex; gap: 12px; flex-wrap: wrap; color: var(--warn); font-size: 12px;
           margin-bottom: 4px; }
  .warns[hidden] { display: none; }
  .srow.ctl select.speed { padding: 3px 6px; font-size: 12px; }
  .srow.ctl .nudge { display: inline-flex; gap: 4px; }
  .srow.ctl .nudge[hidden] { display: none; }
  #inspector .disc { border-color: transparent; color: var(--accent); background: transparent; }
  #inspector .disc[hidden] { display: none; }
  .colour[data-pane], .whybox { display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
                                margin-top: 6px; border-top: 1px solid var(--line); padding-top: 6px; }
  .colour[data-pane][hidden], .whybox[hidden] { display: none; }
  .whybox { display: block; color: var(--dim); font-size: 12px; }
  .whybox .lines { margin: 4px 0 0; max-height: 92px; overflow: auto; }
  .whybox .lines b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums;
                     margin-right: 4px; }
  .colour select { padding: 3px 6px; font-size: 12px; max-width: 170px; }
  .colour input[type=range] { width: 90px; }
  .colour .cstrengthVal { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums;
                          min-width: 28px; }
  .colour label { font-size: 12px; color: var(--dim); display: inline-flex; gap: 4px;
                  align-items: center; }
  .deepline:empty { display: none; }
  .deepline .dl-open { border-color: transparent; background: transparent; color: var(--dim);
                       padding: 2px 0; }
  .shotAsk { margin-top: 6px; }

  /* The dock (INTAKE M11): the sidebar was eight panels stacked 2,900 px tall beside a
     900 px viewport, "sticky" at its top so the bin — panel seven — was reached by
     scrolling the monitor away. Now it is a rail of tools and ONE panel exactly the
     viewport's height that scrolls inside itself; the page never scrolls for it. A new
     tool is one rail button and one <section data-tool>. */
  #dock { position: sticky; top: calc(var(--hd) + 16px);
          height: calc(100vh - var(--hd) - 32px); min-height: 320px;
          display: grid; grid-template-columns: 50px minmax(0,1fr);
          background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          overflow: hidden; }
  #rail { display: flex; flex-direction: column; gap: 4px; padding: 6px 4px;
          background: #131318; border-right: 1px solid var(--line); }
  /* the label sits low so the badge in the top-right corner never covers it */
  #rail .tool { width: 40px; height: 48px; border: 0; border-radius: 8px; padding: 6px 0 4px;
                background: transparent; color: var(--dim); font-size: 9px;
                letter-spacing: .08em; text-transform: uppercase; position: relative;
                display: flex; flex-direction: column; align-items: center;
                justify-content: center; gap: 3px; }
  #rail .tool svg { width: 18px; height: 18px; display: block; }
  #rail .tool:hover { background: var(--card); color: var(--text); }
  #rail .tool.on { background: var(--card); color: var(--accent);
                   box-shadow: inset 2px 0 0 var(--accent); }
  #rail .tool.on span { color: var(--text); }
  #rail .badge { position: absolute; top: 1px; right: 1px; font-size: 9px; line-height: 13px;
                 letter-spacing: 0; text-transform: none; background: var(--accent);
                 color: #0b0b0f; font-weight: 600; border-radius: 999px; padding: 0 4px;
                 font-variant-numeric: tabular-nums; }
  #rail .badge:empty { display: none; }
  /* The dock's left edge drags its width; the main column takes the rest and the
     timeline re-fits (its own ResizeObserver). Double-click puts it back. */
  #dockHandle { position: absolute; left: -7px; top: 0; bottom: 0; width: 14px;
                cursor: col-resize; z-index: 6; }
  #dockHandle::after { content: ""; position: absolute; left: 6px; top: 0; bottom: 0;
                       width: 2px; background: transparent; transition: background .15s; }
  #dockHandle:hover::after, body.dock-resizing #dockHandle::after { background: var(--accent); }
  body.dock-resizing { cursor: col-resize; user-select: none; }
  body.dock-resizing video { pointer-events: none; }
  @media (max-width: 1100px) { #dockHandle { display: none; } }
  #tools { min-height: 0; overflow: auto; padding: 10px 12px; scrollbar-width: thin; }
  #tools h2 { font-size: 11px; letter-spacing: .1em; }
  #tools > section[data-tool][hidden] { display: none; }
  #tools .panel { margin-bottom: 12px; }
  #tools .panel.flat { border: 0; padding: 0; background: transparent; }
  @media (max-width: 1100px) {
    #dock { position: static; height: auto; }
    #tools { max-height: 70vh; }
  }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
           padding: 12px; margin-bottom: 12px; }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
              color: var(--dim); margin: 0 0 8px; }
  textarea {
    width: 100%; min-height: 110px; background: #131318; color: var(--text);
    border: 1px solid var(--line); border-radius: 7px; padding: 8px; font: inherit;
    resize: vertical;
  }
  select, input[type=number], input[type=text] {
    background: #131318; color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 8px; font: inherit;
  }
  /* The bin's search line: typing filters the keeps as you type; Find and Ask the
     model search the whole footage the way the old Find panel did. */
  .findbar { display: flex; gap: 6px; align-items: center; }
  .findbar input { flex: 1; min-width: 0; padding: 6px 10px; border-radius: 8px; }
  .findbar input:focus { outline: none; border-color: var(--accent); }
  .findbar button { padding: 6px 10px; font-size: 12px; white-space: nowrap; border-radius: 8px; }
  #tools button { border-radius: 8px; }
  #tools .keep button.use { border-color: var(--accent); color: var(--accent); background: transparent;
                            font-weight: 600; padding: 3px 10px; }
  #tools .keep button.use:hover { background: var(--accent); color: #0b0b0f; }
  #tools textarea { border-radius: 8px; }
  #tools textarea:focus { outline: none; border-color: var(--accent); }
  #tools select { border-radius: 8px; padding: 6px 8px; }
  /* The finder's player shows the WHOLE clip, seeked to the match — a window is
     somewhere to look, and looking means scrubbing around it. */
  #findVideo { width: 100%; border-radius: 6px; background: #000; display: block;
               aspect-ratio: 16/9; }
  .shotAsk textarea { min-height: 44px; }
  .ask-q { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type=range] { accent-color: var(--accent); }
  .tabs { display: flex; gap: 4px; margin: 10px 0 6px; }
  .tab { font-size: 12px; color: var(--dim); border: 1px solid var(--line);
         border-radius: 999px; padding: 3px 11px; cursor: pointer; }
  .tab:hover { color: var(--text); }
  /* a chosen tab is plain: the one blue control on a screen is Next's (INTAKE M16) */
  .tab.sel { color: var(--text); background: var(--card-hi); border-color: var(--text); font-weight: 600; }
  .kind { font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
          color: var(--dim); border: 1px solid var(--line); border-radius: 4px;
          padding: 0 4px; margin-right: 5px; font-style: normal; }
  .kind.hot { color: var(--warn); border-color: #4c4026; }
  .lib { overflow: auto; }
  .cand { border-top: 1px solid var(--line); padding: 7px 0; cursor: pointer; }
  .cand:first-child { border-top: 0; }
  .cand:hover { background: var(--card-hi); }
  .cand .t { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; }
  .cand .w { display: block; }
  /* The bin as a labelled grid (INTAKE M11): a card per keep — the still, the range,
     the pass's reason and the editor's note, the labels the pass gave it as chips, and
     where it is in the cut or the one control that puts it there. The chips above the
     grid are the same labels as a filter. */
  #binFilter { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 8px; }
  #binFilter[hidden] { display: none; }
  .chip { font-size: 10.5px; border: 1px solid var(--line); border-radius: 999px;
          padding: 0 7px; color: var(--dim); cursor: pointer; white-space: nowrap;
          line-height: 17px; }
  .chip:hover { color: var(--text); }
  .chip.on { border-color: var(--accent); color: var(--text); background: var(--card-hi); }
  .chip.hero { color: var(--warn); }
  .chip.in { color: var(--good); border-color: #2c4c39; }
  #library.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  /* + add shows on the card under the pointer or the selected one (INTAKE M16) */
  .keep:not(:hover):not(.sel):not(:focus-within) button.use.add { visibility: hidden; }
  #findDeep { margin-top: 6px; }
  #findDeep[hidden], #more[hidden], #libHint:empty { display: none; }
  #moreFound { margin-top: 8px; padding: 2px 0; color: var(--accent); }
  .keep { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
          overflow: hidden; cursor: grab; outline: none; }
  .keep:focus-visible, .keep.sel { border-color: var(--accent);
                                   box-shadow: 0 0 0 1px var(--accent); }
  .keep .still { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #000;
                 display: block; }
  .keep .body { padding: 6px 8px 8px; }
  .keep .t { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 11px; }
  .keep .hero { color: var(--warn); font-weight: 600; font-size: 11px; margin-left: 6px;
                letter-spacing: .04em; }
  .keep .w { margin-top: 2px; font-size: 12px; overflow: hidden;
             display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .keep .note { color: var(--dim); font-style: italic; }
  .keep .chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }
  .keep .chips:empty { display: none; }
  .keep .use { display: inline-block; margin-top: 6px; font-size: 12px; }
  .keep a.use { color: var(--accent); text-decoration: none; }
  .keep a.use:hover { text-decoration: underline; }
  .keep button.use { padding: 2px 9px; }
  .keep.missing { opacity: .6; }
  .keep .gone { color: var(--bad); font-size: 12px; margin-top: 5px; display: block; }
  /* Junk (HANDOFF item 5): a proposal wears "junk?" and the two answers; a junk card
     is a clip, not a keep — no add, no drag, just the question. */
  .chip.junk { color: var(--bad); border-color: #4c2c2c; }
  .junkq { display: flex; align-items: center; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .junkq .jb { color: var(--bad); font-weight: 600; font-size: 11px; letter-spacing: .04em;
               cursor: help; }
  .junkq .jb.done { cursor: default; }
  #tools .junkq button.jv { padding: 1px 8px; font-size: 11.5px; }
  .keep.junkcard { cursor: default; border-style: dashed; }
  .keep.junkcard.confirmed { opacity: .65; }
  kbd { background: #222; border: 1px solid var(--line); border-bottom-width: 2px;
        border-radius: 4px; padding: 0 4px; font-size: 11px; }
  .hint { color: var(--dim); font-size: 12px; }
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
  .kv b { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .path { color: var(--dim); font-size: 11px; word-break: break-all; margin-top: 6px; }
  .empty { border: 1px dashed var(--line); border-radius: 10px; padding: 28px 20px;
           text-align: center; color: var(--dim); }
  .empty h3 { color: var(--text); font-size: 15px; margin: 0 0 6px; }
  #filmWhat { margin-bottom: 10px; }
  .filmGo { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  #filmNewest video { width: 100%; border-radius: 6px; background: #000; display: block;
                      aspect-ratio: 16/9; }
  #filmNewest .dl { display: inline-block; margin-top: 6px; }
  #outPanel details { margin-top: 10px; }
  #outPanel summary { cursor: pointer; color: var(--accent); font-size: 12px; }
  .ab select { width: 100%; margin-bottom: 4px; font-size: 12px; }
  .ab { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  .ab video { width: 100%; border-radius: 6px; background: #000; display: block;
              aspect-ratio: 16/9; }
  .ver { border-top: 1px solid var(--line); padding: 7px 0; display: flex;
         align-items: baseline; gap: 8px; }
  .ver:first-child { border-top: 0; }
  .ver .t { flex: 1; font-variant-numeric: tabular-nums; }
  .ver button { padding: 1px 8px; font-size: 12px; }
  /* Getting a finished cut off the board was folklore until now: the only URL it
     exposed is served inline, so a click played the file instead of saving it. */
  .ver .dl { color: var(--accent); text-decoration: none; font-size: 12px;
             border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px;
             white-space: nowrap; }
  .ver .dl:hover { border-color: var(--accent); }
  .hint.warn { color: var(--warn); }
  .hint.bad { color: var(--bad); }
  /* Next (/flow.js): in the header's one row, after the bin · cut name. */
  header #flow { flex: 0 1 auto; min-width: 0; overflow: hidden; }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px;
          font-size: 12px; color: var(--dim); cursor: pointer; white-space: nowrap; }
  .pill.ok { color: var(--good); border-color: #2c4c39; }
  .pill.bad { color: var(--bad); border-color: #4c2c2c; }
  .bar { height: 5px; background: #131318; border-radius: 3px; margin-top: 8px;
         overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent);
           transition: width .3s; }
  #keysBtn { min-width: 34px; }
  /* The key map: an overlay on `?`, like the pass's — not a panel spending 800 px of
     sidebar on the thing read least. timeline-keys.js appends its own section to the
     panel inside (it finds it by the `Keys` heading). */
  #keysOverlay { position: fixed; inset: 0; z-index: 60; background: rgba(4,4,6,.72);
                 display: flex; align-items: center; justify-content: center; padding: 24px; }
  #keysOverlay[hidden] { display: none; }
  #keysOverlay .panel { width: 720px; max-width: 100%; max-height: 86vh; overflow: auto;
                        margin: 0; background: #12121a; padding: 18px 22px; }
  #keysOverlay .panel h2 { font-size: 14px; color: var(--text); text-transform: none;
                           letter-spacing: 0; display: flex; align-items: baseline; gap: 10px; }
  #keysOverlay .panel h2 .hint { font-weight: 400; }
  #keysOverlay .panel > .hint { margin-top: 10px; }
  #keysOverlay #tlKeys { display: none; }
  #keyTable { border-collapse: collapse; width: 100%; font-size: 13px; }
  #keyTable th { text-align: left; color: var(--dim); font-size: 11px; font-weight: 600;
                 text-transform: uppercase; letter-spacing: .08em; padding: 12px 0 4px; }
  #keyTable td { padding: 3px 0; vertical-align: top; color: var(--text); }
  #keyTable td.k { white-space: nowrap; padding-right: 14px; width: 1%; }

  /* The progress strip. One place, below the flow bar, full width, for every long
     operation in the app — Karl: "consider a progress tracking bar up top for anything
     which may take time to complete — re-use across app." It holds more than one at a
     time on purpose: a render and an Ask overlap routinely. */
  #progress { width: 100%; display: flex; flex-direction: column; gap: 7px;
              margin-top: 4px; }
  #progress[hidden] { display: none; }
  .job { display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
         gap: 4px 10px; align-items: center; }
  .job .jlabel { font-weight: 600; font-size: 13px; white-space: nowrap;
                 cursor: pointer; user-select: none; }
  .job .jlabel .caret { color: var(--dim); font-size: 10px; margin-right: 4px; }
  .job .jbar { height: 8px; background: #0d0d11; border: 1px solid var(--line);
               border-radius: 5px; overflow: hidden; }
  .job .jbar i { display: block; height: 100%; width: 0; background: var(--accent);
                 transition: width .5s ease; }
  .job.estimating .jbar i { background: var(--dim); }
  .job.done .jbar i { background: var(--good); }
  .job.failed .jbar i { background: var(--bad); }
  .job .jnums { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12px;
                white-space: nowrap; }
  .job .jdetail { grid-column: 2 / -1; color: var(--dim); font-size: 12px; }
  .job.failed .jdetail { color: var(--bad); }
  .job .jmore { grid-column: 2 / -1; background: #131318; border: 1px solid var(--line);
                border-radius: 7px; padding: 7px 9px; font-size: 12px; }
  .job .jmore ol { margin: 0; padding-left: 18px; }
  .job .jmore li { color: var(--dim); }
  .job .jmore li.at { color: var(--text); }
  .job .jmore li.was { color: var(--good); }
  .job .jmore pre { margin: 7px 0 0; white-space: pre-wrap; color: var(--dim);
                    max-height: 120px; overflow: auto; }
  /* The monitor: one place where the whole cut plays, fed from the proxies. */
  #player { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
            padding: 10px; margin-bottom: 12px; }
  /* About 46 % of the window, and never so tall that the transport, the timeline and
     the shot strip under it leave the screen (INTAKE M16): ~450 px is what sits below. */
  .screen { position: relative; background: #000; border-radius: 6px; overflow: hidden;
            aspect-ratio: 16/9; max-height: min(46vh, calc(100vh - var(--hd) - 450px));
            min-height: 160px; }
  .screen video { position: absolute; inset: 0; width: 100%; height: 100%; display: none;
                  object-fit: contain; }
  .screen video.live { display: block; }
  /* The grade (INTAKE M10, I10.4): a canvas over the live video, drawn by /grade.js
     through the shot's LUT. Shown only while there is a grade to show; the videos
     underneath keep playing, and clicks fall through to them. */
  .screen canvas#gradeCanvas { position: absolute; inset: 0; width: 100%; height: 100%;
                         display: none; object-fit: contain; z-index: 1;
                         pointer-events: none; }
  .screen canvas#gradeCanvas.on { display: block; }
  .screen canvas#fxCanvas { position: absolute; inset: 0; width: 100%; height: 100%;
                            display: none; object-fit: contain; z-index: 3;
                            pointer-events: none; }
  .screen canvas#fxCanvas.live { display: block; }
  .screen canvas#fxCanvas.sketch { display: block; pointer-events: auto; cursor: crosshair;
                                   z-index: 4; }
  /* Whatever the monitor is doing that is not showing a picture — opening a proxy,
     buffering, or being refused permission to play — said on the screen itself. A black
     rectangle that never moves reads as a broken board, and that is what it was taken for. */
  #screenMsg { position: absolute; inset: 0; z-index: 2; display: flex;
               align-items: center; justify-content: center; text-align: center;
               padding: 16px; background: rgba(10,10,14,.72); color: var(--dim); }
  #screenMsg.bad { color: var(--bad); }
  #screenMsg[hidden] { display: none; }
  .transport { display: flex; gap: 10px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .transport .pos { font-variant-numeric: tabular-nums; }
  #monPoster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
               -webkit-user-select: none; user-select: none; }
  #monPoster[hidden] { display: none; }
  #bigPlay { position: absolute; left: 50%; top: 50%; z-index: 2; width: 64px; height: 64px;
             margin: -32px 0 0 -32px; border-radius: 50%; background: rgba(10,10,14,.6);
             color: #fff; font-size: 26px; line-height: 64px; text-align: center;
             padding-left: 4px; pointer-events: none; }
  #bigPlay[hidden] { display: none; }
  #ungraded { position: absolute; right: 8px; top: 8px; z-index: 2; font-size: 11px;
              letter-spacing: .06em; color: var(--dim); background: rgba(10,10,14,.7);
              border-radius: 4px; padding: 1px 6px; pointer-events: none; }
  #ungraded[hidden] { display: none; }
  /* the timeline under the transport is styled by /timeline/timeline.css */
  #toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--card-hi); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 14px; opacity: 0; transition: opacity .18s; pointer-events: none;
    z-index: 50; max-width: 70vw;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <!-- ONE row (INTAKE M16 I16.1): the bin and the cut (/switcher.js — its menu holds the
       footage, the pass and the project's facts), Next (/flow.js), then undo, redo, the
       keys and Make the film. Status shows only when something is wrong. -->
  <button type="button" id="hdBin" title="switch bins or cuts, save a copy · O"></button>
  <div id="flow"></div>
  <div class="grow"></div>
  <!-- "unsaved…" or "save failed" only; a good save says nothing -->
  <span class="hint" id="saveState" data-state="saved">saved</span>
  <button id="undo" title="Undo (⌘Z)" aria-label="undo">↶</button>
  <button id="redo" title="Redo (⌘⇧Z)" aria-label="redo">↷</button>
  <button type="button" id="keysBtn" title="the keys · ?">?</button>
  <!-- Opens the film tool; once a film of this cut exists it is that film's Download.
       The dot: the cut changed since its last film. -->
  <button type="button" id="makeFilm">Make the film</button>
  <!-- Every long operation in the app draws itself here: label, bar, percentage,
       elapsed, ETA and the line saying what it is doing right now. Empty and hidden
       when nothing is running. -->
  <div id="progress" hidden></div>
</header>

<main>
  <section>
    <!-- The monitor. The whole edit plays here from the proxies, shot after shot, so a
         cut is judged by watching it rather than by rendering it first. -->
    <div id="player" style="display:none">
      <!-- preload="metadata", not "auto": an element told to preload everything starts
           at byte 0, and the shot it is about to play may start three minutes in. On
           Killington that meant 0-15s buffered for a shot at 188.2s, with the seek
           queued behind the download. arm() puts the in-point in the URL as a media
           fragment, so the first request after the header lands on the shot. -->
      <div class="screen">
        <!-- At rest the monitor shows the frame under the playhead (the poster endpoint),
             never a black box, with a big ▶ — the screen is the button. -->
        <img id="monPoster" alt="" draggable="false" hidden>
        <video id="pv0" preload="metadata" playsinline></video>
        <video id="pv1" preload="metadata" playsinline></video>
        <!-- The grade: /grade.js draws the live video through the shot's LUT here
             (INTAKE M10). Hidden while the shot's LUT is the identity or G is off. -->
        <canvas id="gradeCanvas"></canvas>
        <!-- The effects over the live video (INTAKE M12): /fx.js draws every effect
             of the live shot here at the live time — `.live` while there is something
             to draw; `.sketch` while the human draws a reference on the frame, when
             it takes the pointer. -->
        <canvas id="fxCanvas"></canvas>
        <span id="bigPlay" aria-hidden="true">▶</span>
        <!-- G's state, on the picture while the grade is off (/grade.js) -->
        <span id="ungraded" hidden>ungraded</span>
        <div id="screenMsg" hidden></div>
      </div>
      <div class="transport">
        <button id="playCut">▶ Play</button>
        <span class="pos"><span id="pos">0:00.0</span> / <span id="posTotal"><span id="total">0:00.0</span></span></span>
        <span class="hint" id="playingWhat"></span>
      </div>
      <!-- The timeline: a ruler, the V1 lane of shot blocks by film time, the playhead
           across the whole cut. The module is /timeline/timeline.js (window.tl); app.js
           mounts it here once the project has loaded. -->
      <div id="tl"></div>
    </div>
    <!-- Both of these belong to the main column, not the dock: the recovery offer
         matters most when the timeline is empty, which is exactly when the dock's Ask
         panel is hidden. -->
    <div id="lastAsk" class="hint" style="display:none;margin-bottom:10px"></div>
    <!-- The proposal is the thing you have to read before deciding, so it sits in the
         main column at full width rather than in the dock. -->
    <div id="proposal" class="panel" style="display:none">
      <h2>Proposed cut</h2>
      <div id="proposalNotes" style="margin-bottom:10px"></div>
      <div id="proposalDiff" style="max-height:340px;overflow:auto"></div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button id="playProposal" data-next-for="cut" title="play the proposed cut in the monitor">▶ Play it</button>
        <button id="acceptProposal">Accept</button>
        <button id="rejectProposal">Discard</button>
      </div>
    </div>
    <!-- The inspector: the selected shot's still, header, lines, why, trims and scoped
         ask — one panel for the timeline's anchor, where the list of one card per shot
         used to be. The board's empty state (no cut yet) renders here too. -->
    <div id="inspector"></div>
  </section>

  <!-- The dock (INTAKE M11): a rail of tools and one panel the height of the viewport.
       The rail is the shelf for what comes next — effects, titles, a beat grid,
       transitions — each one more button here and one more section below. -->
  <aside id="dock">
    <div id="dockHandle" title="drag to resize the dock · double-click to reset"></div>
    <nav id="rail" aria-label="tools">
      <button type="button" class="tool on" data-tool="bin" title="the bin — what the pass kept, and Find"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7l2-4h14l2 4"/><path d="M9 12h6"/></svg><span>Bin</span><b class="badge"></b></button>
      <button type="button" class="tool" data-tool="ask" title="ask for a change · the story"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M15 8l.7 1.8 1.8.7-1.8.7L15 13l-.7-1.8-1.8-.7 1.8-.7z" fill="currentColor" stroke="none"/></svg><span>Ask</span></button>
      <button type="button" class="tool" data-tool="sound" title="the music bed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg><span>Sound</span></button>
      <button type="button" class="tool" data-tool="fx" title="effects — markers, titles, tints, glows, sounds: designed by the model, checked by the machine, accepted by you"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2.5l1.9 4.9 4.9 1.9-4.9 1.9L12 16.1l-1.9-4.9-4.9-1.9 4.9-1.9z"/><path d="M5 15l.9 2.3 2.3.9-2.3.9L5 21.4l-.9-2.3-2.3-.9 2.3-.9z"/><path d="M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg><span>FX</span><b class="badge"></b></button>
      <button type="button" class="tool" data-tool="out" title="make the film · download it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/></svg><span>Film</span></button>
    </nav>
    <div id="tools">
      <!-- BIN — the pass's keeps, two to a row, with one find box (INTAKE M16 I16.4):
           typing filters the keeps, Enter finds a moment anywhere in the footage, and
           the priced model search sits under any find. "not in the cut" is the default
           (C10); the machine's offers — heard, seen, the evidence chips — are behind
           "more found ▸". -->
      <section data-tool="bin">
        <div class="findbar">
          <input type="text" id="findQ" placeholder="find a moment…"
                 title="typing filters the keeps · Enter finds a moment anywhere in the footage">
        </div>
        <div class="hint" id="findState" style="margin-top:4px"></div>
        <div id="findResults" class="lib" style="max-height:32vh;margin-top:6px"></div>
        <button id="findDeep" hidden disabled
                title="One model call reading every transcript and everything the visual pass saw — finds what word-matching cannot (a river said as a stream).">Not it? Ask the model</button>
        <div id="findPlayer" style="display:none;margin-top:8px">
          <video id="findVideo" controls preload="metadata" playsinline></video>
          <div class="hint" id="findWhat" style="margin-top:4px"></div>
          <div style="display:flex;gap:8px;align-items:center;margin-top:6px">
            <button id="findAdd">+ add to cut</button>
            <span class="hint" id="findInfo"></span>
          </div>
        </div>
        <!-- the audit: priced, in view until it has been used once, then under more found -->
        <div id="auditRow" style="display:none;gap:8px;align-items:center;margin:8px 0 0">
          <button id="auditClaims"
            title="A 1 s close look at the highest-ranked jump / fall / crash claims nobody has checked, then the rank is rebuilt">Audit the claims</button>
          <span class="hint" id="auditInfo"></span>
        </div>
        <div class="tabs" id="binTabs">
          <span class="tab sel" data-tab="out">not in the cut</span>
          <span class="tab" data-tab="all">all</span>
        </div>
        <div id="more" hidden>
          <div class="tabs" id="libTabs">
            <span class="tab" data-tab="heard">heard</span>
            <span class="tab" data-tab="seen" style="display:none">seen</span>
          </div>
          <div id="binFilter" hidden></div>
        </div>
        <div class="hint" id="libHint" style="margin-bottom:6px"></div>
        <div class="lib" id="library"></div>
        <button type="button" id="moreFound" class="ghost">more found ▸</button>
      </section>

      <!-- ASK — the one sentence about the film (the EDL's story, the same field and
           words as /open's), and a change asked of the whole cut, priced on its button. -->
      <section data-tool="ask" hidden>
        <div class="panel flat">
          <label class="ask-q" for="story">What is this film about?</label>
          <textarea id="story" style="min-height:66px"
            placeholder="optional — a sentence is enough"></textarea>
        </div>
        <div class="panel flat" id="askPanel">
          <textarea id="note" style="min-height:66px"
            placeholder="tighten the intro · more of the rocks, less of the lift · end on the fall"></textarea>
          <div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap">
            <button id="ask" disabled data-await-price="1">Ask for a change</button>
            <span class="hint" id="askAims"></span>
            <span class="hint" id="askState"></span>
          </div>
        </div>
      </section>

      <!-- SOUND — the music bed, in one line: the track, what it does under the cut,
           how far it dips under talk; the fades behind "more". -->
      <section data-tool="sound" hidden>
        <div class="panel flat" id="musicPanel">
          <select id="musicTrack" style="width:100%"><option value="">no music</option></select>
          <div class="hint" id="musicHint" style="margin-top:6px"></div>
          <div id="musicOpts" style="display:none">
            <label class="hint" style="display:flex;gap:8px;align-items:center;margin-top:8px">dip under talk
              <select id="duck"><option value="0">off</option><option value="6">a little</option><option value="12" selected>a lot</option></select></label>
            <details style="margin-top:8px"><summary class="hint" style="cursor:pointer">more</summary>
              <div class="hint" style="display:flex;gap:12px;margin-top:6px">
                <label>fade in <input type="number" id="fadeIn" min="0" max="20" step="0.5" value="1.5" style="width:58px"> s</label>
                <label>fade out <input type="number" id="fadeOut" min="0" max="20" step="0.5" value="4" style="width:58px"> s</label>
              </div>
            </details>
          </div>
        </div>
      </section>

      <!-- FX — effects the model designs and the machine verifies (INTAKE M12). The
           tool's whole body is drawn by /fx.js into #fx. -->
      <section data-tool="fx" hidden>
        <div id="fx"><div class="hint">effects load with /fx.js</div></div>
      </section>

      <!-- FILM (the tool key stays `out`: #tool=out and the flow keep working) — what
           will be made, the two ways to make it, this cut's newest film and its
           Download; every older film folded away, with Compare two inside. Progress is
           the header's strip, the one progress surface. -->
      <section data-tool="out" hidden>
        <div class="panel flat" id="outPanel">
          <div id="filmWhat"><b id="filmCut"></b><div class="hint" id="filmSince"></div></div>
          <div class="filmGo">
            <!-- #render is the free quick look Next may press; Final 4K is only ever
                 Karl's own click (M14 decision 3). -->
            <button id="render" data-profile="preview" data-next-for="render"
                    title="1920x1080 at 24 fps — quick to make, to watch the cut through">Quick look · 1080p · ~1 min</button>
            <button id="renderFinal" data-profile="delivery"
                    title="the bin's own frame rate, up to 4K, never upscaled — slower, bigger, for the final file">Final 4K · ~17 min</button>
          </div>
          <!-- These play the 720p review copy, never the master: a delivery render is
               4K at ~44 Mbps and no browser streams that off this box. -->
          <div id="filmNewest" hidden>
            <video id="previewA" controls preload="metadata"></video>
            <div class="hint" id="labelA"></div>
            <div class="hint" id="stateA"></div>
            <a class="dl" id="filmDownload">↓ Download</a>
          </div>
          <details id="olderFilms" hidden>
            <summary></summary>
            <div id="versions" class="lib"></div>
            <details id="compare">
              <summary>Compare two</summary>
              <div class="ab">
                <div><select id="cmpPickA"></select><video id="cmpA" controls preload="none"></video></div>
                <div><select id="cmpPickB"></select><video id="cmpB" controls preload="none"></video></div>
              </div>
            </details>
          </details>
        </div>
      </section>
    </div>
  </aside>
</main>

<!-- The keys, on ? — an overlay, the way the pass shows its map: one table grouped by
     task, drawn by /dock.js from the board's keys and the timeline's own table. The
     `Keys` heading stays: timeline-keys.js finds the panel by it and mounts its own
     section (#tlKeys), which the table replaces on screen. -->
<div id="keysOverlay" hidden>
  <div class="panel" role="dialog" aria-label="keys">
    <h2>Keys</h2>
    <table id="keyTable"></table>
    <div class="hint"><kbd>?</kbd> or <kbd>esc</kbd> closes this</div>
  </div>
</div>
<div id="toast"></div>
<!-- The music bed, heard under the monitor. -->
<audio id="bed" loop preload="auto"></audio>
<script src="/cli.js"></script>
<script src="/switcher.js"></script>
<script src="/dock.js"></script>
<script src="/flow.js"></script>
<script src="/timeline/timeline.js"></script>
<script src="/timeline/timeline-trim.js"></script>
<script src="/timeline/timeline-keys.js"></script>
<script src="/timeline/timeline-lanes.js"></script>
<!-- The grade over the monitor (INTAKE M10): loaded before app.js, which calls into
     window.grade when the monitor moves and after a colour save. -->
<script src="/grade.js"></script>
<!-- The effects (INTAKE M12): the FX tool, the monitor overlay, the sketch. -->
<script src="/fx.js"></script>
<script src="/deep.js"></script>
<script src="/app.js"></script>
</body>
</html>
