<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roughcut — the pass</title>
<style>
  /* The floor keeps the board's palette (index.html) on a darker ground: this screen is
   * the picture, and everything around it is margin. Nothing is painted on the picture
   * except the verdict stamp, which fades. */
  :root {
    --bg: #08080b; --panel: #0f0f13; --card: #14141a; --card-hi: #1e1e25;
    --line: #1e1e26; --line-soft: #141419; --text: #e8e8ee; --dim: #9a9aa8; --faint: #6c6c80;
    --accent: #6ea8fe; --good: #64d08a; --good-soft: #b8f0cc; --warn: #e0b050; --bad: #e06a6a;
    --bad-soft: #ffb8b8; --tele: #8fd0ff; --gold: #f0c860;
    --mono: ui-monospace, "IBM Plex Mono", Consolas, monospace;
    --display: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
         font: 13px/1.45 var(--display); }
  #app { display: flex; flex-direction: column; height: 100vh; }
  .hint { color: var(--dim); }
  .small { font-size: 10.5px; }
  .tnum { font-variant-numeric: tabular-nums; }
  .grow { flex: 1; }
  .good { color: var(--good-soft); }
  .bad { color: var(--bad-soft); }
  .lbl { font: 600 9.5px var(--mono); letter-spacing: .1em; color: #8f8fa3; text-transform: uppercase; }
  .key { display: inline-block; font: 600 9.5px var(--mono); color: var(--text); background: #1e1e25;
         border: 1px solid #3a3a48; border-bottom-width: 2px; border-radius: 4px; padding: 0 5px;
         min-width: 16px; text-align: center; line-height: 14px; vertical-align: 1px; }
  a { color: var(--accent); text-decoration: none; }

  /* ---- the header: one row on every screen (INTAKE M16 C1) — the bin · cut switcher,
   * Next (/flow.js: on the pass, how many are left), and ? on the right. Where the round
   * stands is Next's to say; nothing else here counts. ---- */
  #hud { display: flex; align-items: center; gap: 12px; padding: 6px 14px; background: var(--panel);
         border-bottom: 1px solid var(--line); flex: none; font-size: 12px; min-height: 0; }
  #hud #flow { flex: 0 1 auto; min-width: 0; overflow: hidden; }
  #keysBtn { padding: 2px 9px; font: 600 12px var(--mono); }
  /* a batch verdict asks once, in the filter line, before it lands */
  #hudAsk { color: var(--warn); font-weight: 600; }
  #hudAsk[hidden] { display: none; }

  /* ---- the filter line (I2.4): chips for kind · state · clip, a box for a word ---- */
  #filter { display: flex; align-items: center; gap: 12px; padding: 5px 14px; background: #0c0c10;
            border-bottom: 1px solid var(--line); flex: none; font-size: 11px; flex-wrap: wrap; }
  #filter[hidden] { display: none; }
  #filter .fgroup { display: inline-flex; align-items: center; gap: 4px; }
  #filter .fgroup .lbl { margin-right: 3px; }
  .fchip { display: inline-block; cursor: pointer; border: 1px solid #2a2a36; border-radius: 10px;
           padding: 0 7px; line-height: 16px; color: var(--dim); white-space: nowrap; user-select: none; }
  .fchip:hover { border-color: #4a4a5c; color: var(--text); }
  .fchip.on { border-color: var(--accent); color: #fff; background: #12121a; }
  .fchip i { font-style: normal; color: var(--faint); margin-left: 4px; font-size: 9.5px; }
  .fchip.on i { color: var(--accent); }
  #filterText { background: #0e0e13; color: var(--text); border: 1px solid #2a2a36; border-radius: 6px;
                padding: 2px 8px; font: inherit; width: 210px; }
  #filterText:focus { outline: none; border-color: var(--accent); }
  #filterCount { color: var(--text); }
  /* ---- the picture: about half the window. Its size is what the rows under it leave —
   * a size container, so the frame is the largest 16:9 that fits, whatever sits below
   * (it used to subtract a fixed 367 px that predated the machine strip) ---- */
  #stage { display: flex; flex: 1 1 auto; min-height: 0; background: var(--bg); }
  #picture { position: relative; flex: 1; display: flex; align-items: center; justify-content: center;
             background: #050507; min-width: 0; min-height: 0; container-type: size; }
  #frame { position: relative; aspect-ratio: 16 / 9; width: min(100cqw, 100cqh * 16 / 9);
           background: #000; border-radius: 4px; overflow: hidden; }
  #pic { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #stamp { position: absolute; left: 26px; top: 22px; z-index: 6; font: 800 34px var(--display);
           letter-spacing: .06em; border: 3px solid currentColor; border-radius: 8px; padding: 2px 14px;
           transform: rotate(-8deg); background: rgba(8,12,10,.35); pointer-events: none;
           opacity: .95; transition: opacity 900ms ease-out 250ms; }
  #stamp.faded { opacity: .22; }
  #stamp.pick { color: var(--good); }
  #stamp.reject { color: #8f8fa3; }
  #stamp.later { color: var(--warn); }
  #stamp.hero { color: var(--gold); }
  #screenMsg { position: absolute; left: 0; right: 0; bottom: 10px; z-index: 5; text-align: center;
               font: 600 11px var(--mono); color: var(--dim); pointer-events: none; }
  #screenMsg.bad { color: var(--bad); }
  #screenMsg.warn { color: var(--warn); }

  /* a timestamp is a link (I7.2): in WHY, on a witness, in the evidence drawer — click to
   * park the picture on that frame; hovering lights the frame's tick on the tape */
  .chip { display: inline-block; font: 600 10px var(--mono); color: var(--accent); background: #12121a;
          border: 1px solid #2a3a50; border-radius: 3px; padding: 0 4px; line-height: 14px; cursor: pointer;
          vertical-align: 1px; white-space: nowrap; font-style: normal; }
  .chip:hover { border-color: var(--accent); color: #fff; }

  /* seals: three states, colour AND the word */
  .seal { display: flex; flex-direction: column; gap: 1px; font: 500 10.5px var(--mono);
          letter-spacing: .02em; color: #cfd6e4; background: var(--card); border: 1px solid #2a2a36;
          border-left-width: 3px; border-radius: 6px; padding: 5px 8px; }
  .seal .s { font-size: 8.5px; letter-spacing: .1em; color: #8f8fa3; font-weight: 600; }
  .seal.aud { border-left-color: var(--good); } .seal.aud .s { color: var(--good-soft); }
  .seal.claim { border-left-color: #8f8fa3; }
  .seal.contra { border-left-color: var(--bad); } .seal.contra .s { color: var(--bad-soft); }
  .seal.tele { border-left-color: var(--tele); } .seal.tele .s { color: var(--tele); }
  .seal.heard { border-left-color: var(--text); }
  .seal.theme { border-left-color: var(--accent); } .seal.theme .s { color: var(--accent); }
  /* a note shows once one is made (or while it is typed): the row is hidden otherwise */
  #noteRow { flex: none; padding: 0 14px 6px; background: #0b0b0f; font-size: 12px; }
  #noteSlot { color: var(--text); }
  #noteEdit { width: 100%; min-height: 54px; background: #0e0e13; color: var(--text);
              border: 1px solid var(--accent); border-radius: 6px; padding: 6px 8px; font: inherit;
              resize: vertical; }
  #dictState.live { color: var(--bad-soft); }
  /* the V key wears the microphone's state: green once allowed, amber while the browser
   * will still ask, red when the site is blocked; words only when something is wrong */
  .key[data-mic="granted"] { color: var(--good-soft); border-color: #2c4c39; }
  .key[data-mic="prompt"] { color: #ffe9b8; border-color: #4c4026; }
  .key[data-mic="denied"] { color: var(--bad-soft); border-color: #6a2c2c; }
  #dictHint { color: var(--bad-soft); }

  /* ---- the machine's line: for a moment only the machine saw, what it saw and, in one
   * word, whether anyone checked. A spoken moment has none — its words are on the strip ---- */
  #caption { display: flex; align-items: baseline; gap: 10px; padding: 6px 14px; background: #0c0c10;
             border-top: 1px solid var(--line-soft); font-size: 12.5px; flex: none; }
  #why { color: var(--text); font-style: normal; }

  /* ---- the two-tier strip ----
   * The tape is the whole clip: a ruler, every pick as a mark (this one as a bright bracket),
   * and a lens showing exactly the seconds the closer strip holds. The closer strip is ±8 s
   * around the playhead with the green band — the clip — drawn on it; its handles and its
   * middle are the trim. Both take a pointer: a click seeks, a drag scrubs. */
  /* the clip strip's name sits on its own ground over the ruler's first labels */
  .strip-lbl { position: absolute; left: 10px; top: 2px; font: 600 10px var(--mono); color: #cfd6e4;
               z-index: 4; pointer-events: none; background: #0b0b0f; padding: 0 4px; }
  .strip-lbl b { font-weight: 700; }
  #tape { position: relative; height: 42px; background: #0b0b0f; border-top: 1px solid #26262f;
          flex: none; cursor: crosshair; touch-action: none; user-select: none; }
  #tapeRuler span { position: absolute; top: 2px; height: 14px; border-left: 1px solid #3a3a48;
                    padding-left: 3px; font: 8.5px/14px var(--mono); color: #6c6c80; white-space: nowrap;
                    pointer-events: none; }
  #tapeLens { position: absolute; top: 15px; bottom: 3px; background: rgba(207,214,228,.07);
              border: 1px solid rgba(207,214,228,.4); border-radius: 3px; pointer-events: none; z-index: 1; }
  #tapeMarks span { position: absolute; top: 21px; height: 14px; min-width: 6px; border-radius: 2px;
                    background: #3a3a48; }
  #tapeMarks span.pick { background: var(--good); }
  #tapeMarks span.reject { background: #26262f; }
  #tapeMarks span.later { background: var(--warn); }
  #tapeMarks span.hero { background: var(--gold); }
  /* outside the filter: dimmed, still there — the queue is frozen, only the eye narrows */
  #tapeMarks span.dim { opacity: .25; }
  /* this pick is a bracket over its window; it takes no pointer, so a click on it reaches a
   * mark beneath it, or the tape */
  #tapeMarks span.now { background: rgba(110,168,254,.22); border: 2px solid #fff; border-bottom: none;
                        border-radius: 3px 3px 0 0; top: 17px; height: 21px; min-width: 8px; z-index: 2;
                        pointer-events: none; }
  #tapeMarks span.jump { cursor: pointer; }
  #tapeMarks span.jump:hover { outline: 1px solid #cfd6e4; }
  /* the kept range on the tape: the same green as the closer strip's band, solid, inside the
   * bracket — so where the clip sits in the whole clip is never a guess (I2.8 1b) */
  #tapeKeep { position: absolute; top: 21px; height: 14px; background: rgba(100,208,138,.72);
              border-top: 1px solid var(--good); border-bottom: 1px solid var(--good); z-index: 1;
              pointer-events: none; }
  #tapeHead { position: absolute; top: 0; bottom: 0; width: 1px; background: #fff; opacity: .7; z-index: 3;
              pointer-events: none; }
  #bridge { position: relative; height: 16px; background: #0b0b0f; flex: none; }
  #bridgeSvg { display: block; width: 100%; height: 16px; }
  #bridgeLens { fill: rgba(207,214,228,.07); stroke: rgba(207,214,228,.4); stroke-width: 1;
                vector-effect: non-scaling-stroke; }
  #bridgeHead { stroke: #fff; stroke-width: 1; opacity: .7; vector-effect: non-scaling-stroke; }
  #zoom { position: relative; height: 70px; background: #0d0d12; border-top: 1px solid #26262f;
          border-bottom: 1px solid #26262f; overflow: hidden; flex: none; cursor: crosshair;
          touch-action: none; user-select: none; }
  #zoom.drag-in, #zoom.drag-out { cursor: ew-resize; }
  #zoom.drag-slide, #zoom.drag-slide #zoomKeep { cursor: grabbing; }
  #zoomInner { position: absolute; top: 0; bottom: 0; left: 0; will-change: transform; }
  #zoomInner .w { position: absolute; top: 22px; font-size: 11px; color: #8f8fa3; white-space: nowrap;
                  transform: translateX(-50%); }
  #zoomInner .w.in { color: var(--text); }
  #zoomInner .sb { position: absolute; top: 25px; height: 8px; border-radius: 2px; background: #2e2e3a; }
  #zoomInner .sb.in { background: #4a4a5c; }
  #zoomInner .sb i { position: absolute; left: 4px; top: 10px; font: 10px var(--display); color: #6c6c80;
                     white-space: nowrap; font-style: normal; }
  #zoomInner .snap { position: absolute; top: 42px; width: 2px; height: 12px; background: var(--accent); }
  #zoomInner .snap.start { height: 8px; top: 46px; opacity: .7; }
  #zoomInner .snap.word { height: 6px; top: 48px; width: 1px; background: #4a6a96; }
  #zoomInner .snap.lit { background: #fff; opacity: 1; box-shadow: 0 0 6px var(--accent); }
  #zoomKeep { position: absolute; top: 14px; height: 34px; background: rgba(100,208,138,.14);
              border-top: 1px solid rgba(100,208,138,.7); border-bottom: 1px solid rgba(100,208,138,.7);
              cursor: grab; }
  /* a handle is a 14 px hit area (touch-sized) with the 8 px bar drawn inside it */
  .handle { position: absolute; top: 10px; height: 42px; width: 14px; margin-left: -7px; cursor: ew-resize;
            z-index: 2; }
  .handle::after { content: ""; position: absolute; left: 3px; right: 3px; top: 0; bottom: 0; background: #cfd6e4;
                   border-radius: 3px; opacity: .8; }
  .handle.active::after { background: #fff; opacity: 1; box-shadow: 0 0 0 1px var(--accent); }
  #zoomHead { position: absolute; left: 50%; top: 8px; height: 46px; width: 2px; background: #fff; z-index: 3;
              pointer-events: none; }
  #zoomHint { position: absolute; bottom: 3px; font: 600 9px var(--mono); color: var(--accent);
              transform: translateX(-50%); white-space: nowrap; pointer-events: none; z-index: 4; }
  #zoomHint.drag { color: #fff; font-size: 10px; background: rgba(8,8,11,.85); padding: 1px 6px;
                   border-radius: 3px; }

  /* ---- the kept range, said once, beside the band; the machine's line on the right ---- */
  #keepRow { display: flex; align-items: baseline; gap: 10px; padding: 6px 14px; background: #0b0b0f;
             font-size: 12px; flex: none; }
  #ctxKeep { color: var(--good-soft); white-space: nowrap; }
  #ctxExtend { font: 600 10.5px var(--mono); padding: 1px 8px; border-radius: 6px; }
  #deepFloor { flex: 1; min-width: 0; text-align: right; }
  #deepFloor .dv-more { text-align: left; max-height: 34vh; overflow: auto; }

  /* ---- the key line: the three verdicts, clickable at twice a keycap's size (INTAKE
   * M16 decision 5 — the keys are unchanged); the rest dim, on the right ---- */
  #keys { display: flex; gap: 14px; align-items: center; padding: 6px 14px; background: var(--panel);
          border-top: 1px solid var(--line); font-size: 10.5px; color: #a0a0b0; flex-wrap: wrap; flex: none; }
  .vkey { background: transparent; border: none; padding: 2px 4px; font-size: 14px; color: var(--text);
          display: inline-flex; align-items: center; gap: 8px; }
  .vkey .key { font-size: 19px; line-height: 28px; min-width: 34px; padding: 0 9px; border-radius: 6px; }
  .vkey:hover .key { border-color: var(--accent); }
  #keys .dimkeys [data-key] { cursor: pointer; }
  #keys .dimkeys [data-key]:hover { color: var(--text); }

  /* ---- overlays: evidence drawer, key map, more menu, the closing card ---- */
  #overlay { position: fixed; inset: 0; z-index: 30; background: rgba(4,4,6,.72); display: flex;
             align-items: center; justify-content: center; padding: 24px; }
  /* an id selector outranks the UA's [hidden] rule, so say it explicitly */
  #overlay[hidden], #stamp[hidden], #screenMsg[hidden], #noteEdit[hidden], #noteRow[hidden], #caption[hidden],
  #ctxExtend[hidden], #ctxTake[hidden], .handle[hidden] { display: none; }
  #overlay .box { background: #12121a; border: 1px solid #2a2a36; border-radius: 14px; padding: 22px 26px;
                  max-width: 820px; width: 100%; max-height: 90vh; overflow: auto; }
  #overlay h2 { margin: 0 0 12px; font: 800 22px var(--display); }
  #overlay h2 .hint { font: 12px var(--display); margin-left: 12px; }
  .keymap { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px; font-size: 12px; }
  .keymap div { display: flex; gap: 10px; align-items: baseline; padding: 3px 0; border-bottom: 1px solid #1a1a22; }
  .keymap .key { min-width: 22px; }
  .ev { border-top: 1px solid #1e1e26; padding: 8px 0; font-size: 12px; }
  .ev .s { font: 600 9.5px var(--mono); letter-spacing: .1em; }
  .ev pre { margin: 6px 0 0; font: 10.5px var(--mono); color: var(--dim); white-space: pre-wrap; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .stats > div { background: #0f0f14; border-radius: 8px; padding: 10px 12px; }
  .stats .n { font: 700 20px var(--display); }
  .stats .n.good { color: var(--good-soft); }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  button { font: inherit; font-size: 11.5px; background: var(--card-hi); color: var(--text);
           border: 1px solid #3a3a48; border-radius: 8px; padding: 7px 14px; cursor: pointer; }
  button.primary { background: var(--accent); color: #0b0b0f; border-color: transparent; font-weight: 600; }
  button.priced { border-color: #4c4026; color: #ffe9b8; }
  button:disabled { opacity: .45; cursor: default; }

  /* the survey: takes side by side, the cursor's outlined, this pick starred, an earlier
   * round's greyed */
  #overlay[data-kind="survey"] .box { max-width: 1160px; }
  .takes { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
  .take { background: #0f0f14; border: 1px solid #2a2a36; border-radius: 8px; padding: 8px; cursor: pointer;
          font-size: 11.5px; min-width: 0; }
  .take.cursor { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .take.here { background: #12161a; }
  .take.gone { opacity: .45; cursor: default; }
  .take img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #000;
              border-radius: 4px; margin-bottom: 6px; }
  .take .t1 { color: var(--text); }
  .take .t1 .star { color: var(--gold); }
  .take .t2 { color: var(--dim); margin-top: 3px; overflow: hidden; text-overflow: ellipsis;
              display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .take .t3 { color: var(--tele); font: 10.5px var(--mono); margin-top: 3px; }
  .take .t4 { font: 600 9.5px var(--mono); letter-spacing: .1em; margin-top: 5px; color: #8f8fa3; }
  .take .t4.pick { color: var(--good-soft); }
  .take .t4.later { color: var(--warn); }

  #toast { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); background: #1e1e25;
           color: var(--text); border: 1px solid #3a3a48; border-radius: 8px; padding: 8px 14px; font-size: 12px;
           opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; max-width: 70vw; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <button type="button" id="hdBin" title="switch bins or cuts, save a copy · O"></button>
    <div id="flow"></div>
    <span class="grow"></span>
    <button type="button" id="keysBtn" title="every key">?</button>
  </div>
  <!-- the filter line (I2.4): `/` opens it, Esc clears it. Chips, not buttons — the pass
       has no buttons in the flow; a chip is a term, like a mark on the tape is a pick. -->
  <div id="filter" hidden>
    <span class="lbl">Filter</span>
    <span class="fgroup"><span class="lbl">kind</span><span id="filterKinds"></span></span>
    <span class="fgroup"><span class="lbl">state</span><span id="filterStates"></span></span>
    <span class="fgroup"><span class="lbl">clip</span><span id="filterClips"></span></span>
    <input id="filterText" type="text" placeholder="a word in the reason or a witness" spellcheck="false" autocomplete="off">
    <span id="filterCount" class="tnum"></span>
    <span id="hudAsk" class="tnum" hidden></span>
    <span class="grow"></span>
    <span class="hint small"><span class="key">↵</span><span class="key">⌫</span> step through what matches · <span class="key">⇧X</span> reject them · <span class="key">⇧U</span> later · <span class="key">Esc</span> clears</span>
  </div>

  <div id="stage">
    <div id="picture">
      <div id="frame">
        <video id="pic" preload="metadata" playsinline></video>
        <div id="stamp" hidden></div>
        <div id="screenMsg" hidden></div>
      </div>
    </div>
  </div>

  <div id="caption" hidden><i id="why"></i></div>

  <div id="tape">
    <span class="strip-lbl" id="tapeLbl"><b id="ctxClip"></b> <span id="ctxClipMeta"></span></span>
    <div id="tapeRuler"></div>
    <div id="tapeLens"></div>
    <div id="tapeMarks"></div>
    <div id="tapeKeep" title="the kept range — the clip — where it sits in the whole clip"></div>
    <div id="tapeHead"></div>
  </div>
  <!-- the bridge: the lens's edges on the tape fan out to the closer strip's full width, and
       the playhead runs from the one to the other, so the eye reads "these seconds of that clip" -->
  <div id="bridge" aria-hidden="true">
    <svg id="bridgeSvg" viewBox="0 0 1000 16" preserveAspectRatio="none">
      <polygon id="bridgeLens" points="0,0 1000,0 1000,16 0,16"></polygon>
      <line id="bridgeHead" x1="0" y1="0" x2="500" y2="16"></line>
    </svg>
  </div>
  <!-- the words around the playhead, the kept part lit; the green band is the clip — drag
       its edges to trim it, its middle to slide it -->
  <div id="zoom">
    <div id="zoomInner"></div>
    <div id="zoomKeep"></div>
    <div id="handleIn" class="handle" title="the in-point — drag to trim"></div>
    <div id="handleOut" class="handle active" title="the out-point — drag to trim"></div>
    <div id="zoomHint"></div>
    <div id="zoomHead"></div>
  </div>
  <div id="keepRow">
    <span id="ctxKeep" class="tnum"></span>
    <button type="button" id="ctxExtend" hidden>} next line</button>
    <span id="ctxTake" class="hint" hidden></span>
    <!-- how the machine saw this clip, one line that opens the strip (INTAKE M16) — deep.js -->
    <div id="deepFloor"></div>
  </div>
  <div id="noteRow" hidden>
    <div id="noteSlot"><span id="noteText"></span> <span id="noteMeta" class="hint"></span>
      <textarea id="noteEdit" hidden placeholder="what you see — Enter to keep it, Esc to cancel"></textarea></div>
  </div>

  <div id="keys">
    <button type="button" class="vkey" data-v="pick"><span class="key">P</span>pick</button>
    <button type="button" class="vkey" data-v="reject"><span class="key">X</span>reject</button>

  </div>
